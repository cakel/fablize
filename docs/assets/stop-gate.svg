<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">When the Stop gate holds Claude back</title>
  <desc id="d">When Claude tries to finish, the gate lets it finish if the task was quick or normal, if nothing or only docs changed, or if a check ran and passed. If the user said not to run tests, or Claude was already reminded twice, it finishes with an unverified note to the user. Otherwise Claude is reminded to run a check and tries again.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="559" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="40" y="38" font-size="18" font-weight="700" fill="#111827">When does fablize say “not yet”?</text>

  <rect x="60" y="56" width="340" height="40" rx="20" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="230" y="81" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Claude tries to finish</text>

  <!-- questions: yes = finish -->
  <g font-size="14" fill="#1e3a8a">
    <rect x="60" y="120" width="340" height="46" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="76" y="148">Quick or normal task? (not “thorough”)</text>
    <rect x="60" y="190" width="340" height="46" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="76" y="218">Nothing changed, or only docs?</text>
    <rect x="60" y="260" width="340" height="46" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="76" y="288">A check ran and passed?</text>
    <rect x="60" y="330" width="340" height="46" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="76" y="358">You said “don't run tests”?</text>
    <rect x="60" y="400" width="340" height="46" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="76" y="428">Already reminded twice?</text>
  </g>

  <g stroke="#6b7280" stroke-width="2" marker-end="url(#a)">
    <line x1="230" y1="96" x2="230" y2="116"/>
    <line x1="230" y1="166" x2="230" y2="186"/>
    <line x1="230" y1="236" x2="230" y2="256"/>
    <line x1="230" y1="306" x2="230" y2="326"/>
    <line x1="230" y1="376" x2="230" y2="396"/>
    <line x1="230" y1="446" x2="230" y2="470"/>
    <line x1="400" y1="143" x2="466" y2="143"/>
    <line x1="400" y1="213" x2="466" y2="213"/>
    <line x1="400" y1="283" x2="466" y2="283"/>
    <line x1="400" y1="353" x2="466" y2="353"/>
    <line x1="400" y1="423" x2="466" y2="423"/>
  </g>
  <g font-size="12" fill="#6b7280">
    <text x="238" y="181">no</text><text x="238" y="251">no</text><text x="238" y="321">no</text>
    <text x="238" y="391">no</text><text x="238" y="462">no</text>
    <text x="420" y="136">yes</text><text x="420" y="206">yes</text><text x="420" y="276">yes</text>
    <text x="420" y="346">yes</text><text x="420" y="416">yes</text>
  </g>

  <!-- outcomes -->
  <rect x="470" y="120" width="250" height="186" rx="12" fill="#ecfdf5" stroke="#10b981"/>
  <text x="595" y="206" font-size="16" font-weight="700" fill="#065f46" text-anchor="middle">Finish</text>
  <text x="595" y="230" font-size="12" fill="#065f46" text-anchor="middle">nothing to hold back</text>
  <rect x="470" y="330" width="250" height="116" rx="12" fill="#fefce8" stroke="#ca8a04"/>
  <text x="595" y="378" font-size="16" font-weight="700" fill="#854d0e" text-anchor="middle">Finish + note to you</text>
  <text x="595" y="402" font-size="12" fill="#854d0e" text-anchor="middle">“changed, but not verified”</text>

  <!-- reminder loops back -->
  <rect x="60" y="474" width="340" height="56" rx="12" fill="#fff7ed" stroke="#f97316"/>
  <text x="76" y="498" font-size="14" font-weight="700" fill="#9a3412">Remind Claude: “run a check first”</text>
  <text x="76" y="518" font-size="12" fill="#9a3412">then it keeps working and tries again</text>
  <path d="M60,502 H36 V76 H56" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#a)"/>
</svg>
