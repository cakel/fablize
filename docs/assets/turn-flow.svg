<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">What happens in one turn with fablize</title>
  <desc id="d">You ask, fablize reads the request and picks a checklist, Claude works while fablize notes what changed and which checks ran, and when Claude wants to stop with changed code but no passing check, fablize reminds it to check first, at most twice.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="329" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="44" font-size="18" font-weight="700" fill="#111827">What happens in one turn</text>

  <!-- 1 -->
  <rect x="32" y="76" width="190" height="124" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="48" y="104" font-size="15" font-weight="700" fill="#111827">1  You ask</text>
  <text x="48" y="130" font-size="13" fill="#374151">“Fix the login bug”</text>
  <text x="48" y="150" font-size="13" fill="#374151">“Build a chart page”</text>

  <!-- 2 -->
  <rect x="252" y="76" width="190" height="124" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="268" y="104" font-size="15" font-weight="700" fill="#1e3a8a">2  fablize reads it</text>
  <text x="268" y="130" font-size="13" fill="#1e3a8a">picks a checklist:</text>
  <text x="268" y="150" font-size="13" fill="#1e3a8a">bug · visual · many steps</text>
  <text x="268" y="170" font-size="13" fill="#1e3a8a">and how strict to be</text>

  <!-- 3 -->
  <rect x="472" y="76" width="190" height="124" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="488" y="104" font-size="15" font-weight="700" fill="#111827">3  Claude works</text>
  <text x="488" y="130" font-size="13" fill="#374151">fablize quietly notes</text>
  <text x="488" y="150" font-size="13" fill="#374151">what changed and</text>
  <text x="488" y="170" font-size="13" fill="#374151">which checks passed</text>

  <!-- 4 -->
  <rect x="692" y="76" width="190" height="124" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="708" y="104" font-size="15" font-weight="700" fill="#1e3a8a">4  Ready to stop?</text>
  <text x="708" y="130" font-size="13" fill="#1e3a8a">code changed but</text>
  <text x="708" y="150" font-size="13" fill="#1e3a8a">nothing was checked?</text>

  <line x1="222" y1="138" x2="248" y2="138" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <line x1="442" y1="138" x2="468" y2="138" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <line x1="662" y1="138" x2="688" y2="138" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>

  <!-- no: done -->
  <line x1="787" y1="200" x2="787" y2="236" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <text x="795" y="224" font-size="12" fill="#6b7280">no</text>
  <rect x="692" y="240" width="190" height="64" rx="12" fill="#ecfdf5" stroke="#10b981"/>
  <text x="708" y="266" font-size="15" font-weight="700" fill="#065f46">Done</text>
  <text x="708" y="288" font-size="12" fill="#065f46">still unchecked? you get a note</text>

  <!-- yes: reminder, loops back to 3 -->
  <path d="M692,186 H677 V272 H666" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <text x="652" y="234" font-size="12" fill="#6b7280" text-anchor="end">yes</text>
  <rect x="472" y="240" width="190" height="64" rx="12" fill="#fff7ed" stroke="#f97316"/>
  <text x="488" y="266" font-size="15" font-weight="700" fill="#9a3412">“Check it first”</text>
  <text x="488" y="288" font-size="12" fill="#9a3412">reminder, at most 2 times</text>
  <line x1="567" y1="240" x2="567" y2="204" stroke="#f97316" stroke-width="2" marker-end="url(#a)"/>

  <!-- legend -->
  <rect x="32" y="252" width="14" height="14" rx="3" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="54" y="264" font-size="12" fill="#374151">= fablize (hooks). Claude does the work;</text>
  <text x="54" y="282" font-size="12" fill="#374151">fablize only watches and reminds.</text>
</svg>
