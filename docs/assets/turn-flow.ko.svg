<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">fablize가 있을 때 한 번의 요청에서 일어나는 일</title>
  <desc id="d">사용자가 요청하면 fablize가 요청을 읽고 체크리스트를 고른다. Claude가 일하는 동안 fablize는 무엇이 바뀌었고 어떤 확인이 통과했는지 기록한다. 코드를 바꾸고 확인 없이 끝내려 하면 먼저 확인하라고 최대 두 번 알린다.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="329" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="44" font-size="18" font-weight="700" fill="#111827">요청 한 번에 일어나는 일</text>

  <!-- 1 -->
  <rect x="32" y="76" width="190" height="124" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="48" y="104" font-size="15" font-weight="700" fill="#111827">1  요청</text>
  <text x="48" y="130" font-size="13" fill="#374151">“로그인 버그 고쳐줘”</text>
  <text x="48" y="150" font-size="13" fill="#374151">“차트 페이지 만들어줘”</text>

  <!-- 2 -->
  <rect x="252" y="76" width="190" height="124" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="268" y="104" font-size="15" font-weight="700" fill="#1e3a8a">2  fablize가 읽음</text>
  <text x="268" y="130" font-size="13" fill="#1e3a8a">맞는 체크리스트 선택</text>
  <text x="268" y="150" font-size="13" fill="#1e3a8a">버그 · 화면 · 여러 단계</text>
  <text x="268" y="170" font-size="13" fill="#1e3a8a">얼마나 엄격할지도 정함</text>

  <!-- 3 -->
  <rect x="472" y="76" width="190" height="124" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="488" y="104" font-size="15" font-weight="700" fill="#111827">3  Claude가 작업</text>
  <text x="488" y="130" font-size="13" fill="#374151">fablize는 조용히 기록</text>
  <text x="488" y="150" font-size="13" fill="#374151">무엇이 바뀌었고</text>
  <text x="488" y="170" font-size="13" fill="#374151">어떤 확인이 통과했나</text>

  <!-- 4 -->
  <rect x="692" y="76" width="190" height="124" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="708" y="104" font-size="15" font-weight="700" fill="#1e3a8a">4  끝내려 할 때</text>
  <text x="708" y="130" font-size="13" fill="#1e3a8a">코드는 바꿨는데</text>
  <text x="708" y="150" font-size="13" fill="#1e3a8a">확인은 안 했나?</text>

  <line x1="222" y1="138" x2="248" y2="138" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <line x1="442" y1="138" x2="468" y2="138" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <line x1="662" y1="138" x2="688" y2="138" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>

  <!-- no: done -->
  <line x1="787" y1="200" x2="787" y2="236" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <text x="795" y="224" font-size="12" fill="#6b7280">아니오</text>
  <rect x="692" y="240" width="190" height="64" rx="12" fill="#ecfdf5" stroke="#10b981"/>
  <text x="708" y="266" font-size="15" font-weight="700" fill="#065f46">완료</text>
  <text x="708" y="288" font-size="12" fill="#065f46">미확인이면 사용자에게 알림</text>

  <!-- yes: reminder, loops back to 3 -->
  <path d="M692,186 H677 V272 H666" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
  <text x="652" y="234" font-size="12" fill="#6b7280" text-anchor="end">예</text>
  <rect x="472" y="240" width="190" height="64" rx="12" fill="#fff7ed" stroke="#f97316"/>
  <text x="488" y="266" font-size="15" font-weight="700" fill="#9a3412">“먼저 확인하세요”</text>
  <text x="488" y="288" font-size="12" fill="#9a3412">알림, 최대 2번</text>
  <line x1="567" y1="240" x2="567" y2="204" stroke="#f97316" stroke-width="2" marker-end="url(#a)"/>

  <!-- legend -->
  <rect x="32" y="252" width="14" height="14" rx="3" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="54" y="264" font-size="12" fill="#374151">= fablize(훅). 일은 Claude가 하고</text>
  <text x="54" y="282" font-size="12" fill="#374151">fablize는 지켜보고 알리기만 한다.</text>
</svg>
