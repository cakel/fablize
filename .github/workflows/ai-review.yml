name: AI PR Code Review

# Public repo: precheck runs on a GitHub-hosted runner and blocks fork PRs and
# non-collaborators before anything reaches the self-hosted review runner.
# No issue_comment trigger, so only same-repo PRs get reviewed.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  ai-review:
    uses: cakel/llm-pr-reviewer/.github/workflows/reusable-ai-review.yml@6b404463c3225f9ae79dc6d037c18e91f07e07ad  # v1.3.1
    with:
      runner: '["ubuntu-latest"]'
      review-runner: '["self-hosted", "review"]'
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
